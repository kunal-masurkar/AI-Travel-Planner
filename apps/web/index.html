<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1329" />
    <meta name="description" content="Plan trips across India: compare 3–7 day itineraries, estimate costs, discover places, food and stays, and save your plans." />
    <title>YatraAI — India Travel Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="/style.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div class="app-shell">
      <div class="ambient-glow glow-amber" aria-hidden="true"></div>
      <div class="ambient-glow glow-emerald" aria-hidden="true"></div>
      <div class="ambient-glow glow-indigo" aria-hidden="true"></div>

      <header class="top-nav">
        <div class="nav-container">
          <a class="brand" href="#/" aria-label="YatraAI home">
            <div class="brand-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z" />
                <circle cx="12" cy="10" r="3" />
              </svg>
            </div>
            <div class="brand-text">
              <span class="brand-name">Yatra<span>AI</span></span>
              <span class="brand-tagline">India Travel Studio</span>
            </div>
          </a>

          <nav class="main-nav" aria-label="Main">
            <a href="#/" data-nav="home">Explore</a>
            <a href="#/plan" data-nav="plan">Plan a trip</a>
            <a href="#/trips" data-nav="trips">My trips</a>
          </nav>

          <div class="nav-actions" id="account-area"></div>
        </div>
      </header>

      <main class="page" id="view" tabindex="-1">
        <div class="page-loading">Loading…</div>
      </main>

      <footer class="site-footer">
        <p>Prices, ratings and opening hours are indicative — always confirm before you book. Map data © OpenStreetMap contributors · Images from Wikipedia.</p>
      </footer>

      <div id="loader-overlay" class="loader-overlay" hidden>
        <div class="loader-modal" role="status" aria-live="polite">
          <div class="loader-spinner-ring"><div class="inner-pulse"></div></div>
          <h3 id="loader-title">Crafting your itinerary</h3>
          <p id="loader-step-text"></p>
          <div class="loader-progress-bar"><div class="loader-progress-fill" id="loader-progress-fill"></div></div>
        </div>
      </div>

      <div id="auth-overlay" class="modal-overlay" hidden></div>
      <div id="toast-host" class="toast-host" aria-live="polite"></div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
